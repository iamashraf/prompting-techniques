[project]
name = "prompting-techniques"
version = "0.1.0"
description = "Runnable, comparable implementations of LLM prompting techniques, built step by step while learning them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
prompting-techniques = "prompting_techniques:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
